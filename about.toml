# cargo-about: the third-party license notices the images carry
# (THIRD-PARTY-LICENSES.txt, generated from Cargo.lock with about.hbs;
# docs/src/content/docs/contributing/development.md, "Licenses").
# What the images contain: the musl builds' runtime dependencies, without
# build-only and dev-only crates.
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# ferritor's own crates (all publish = false): their license is
# LICENSE-MIT and LICENSE-APACHE, beside this file in the images. Their
# dependencies stay.
private = { ignore = true }
# The same list as deny.toml's [licenses] allow.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "Unlicense",
]

# cargo-about: the third-party license notices the images carry
# (THIRD-PARTY-LICENSES.txt, generated from Cargo.lock with about.hbs, with
# --workspace: the root Cargo.toml is a package too, and without it only
# that one's (no) dependencies would be listed;
# docs/src/content/docs/contributing/development.md, "Licenses").
# What the release ships: the musl builds' runtime dependencies (the images,
# the Linux archives) and the CLI's for macOS and Windows (its archives),
# without build-only and dev-only crates. One file for all of them.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# ferritor's own crates (all publish = false): their license is
# LICENSE-MIT and LICENSE-APACHE, beside this file in the images. Their
# dependencies stay.
private = { ignore = true }
# The same list as deny.toml's [licenses] allow.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "Unlicense",
]

# libmimalloc-sys (the images' allocator) holds two licenses: its own, and
# the mimalloc C library's it compiles in (Microsoft's, which matters most),
# in two identical copies (v2, v3; v3 is built). Unclarified, which one
# cargo-about picked depended on the order the filesystem listed them in.
# Named here, by checksum: a new version that changes one fails the
# generation instead of quietly changing the notice.
[libmimalloc-sys.clarify]
license = "MIT"

[[libmimalloc-sys.clarify.files]]
path = "LICENSE.txt"
license = "MIT"
checksum = "a08554fab028af3af047e8588d32d019662c1b1bf07959a195a2f75fe340726b"

[[libmimalloc-sys.clarify.files]]
path = "c_src/mimalloc/v3/LICENSE"
license = "MIT"
checksum = "82ade5d7d9b029044b5fbbc326207fc47c2d44ee4dd71e8a559c36d728217de9"

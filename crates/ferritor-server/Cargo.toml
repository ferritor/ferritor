[package]
name = "ferritor-server"
version.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true

[features]
default = ["aws-kms", "gcp-kms"]
# Auto-unseal with AWS KMS (`[seal] provider = "awskms"`): the AWS SDK's KMS
# client and credential chain, and their HTTP stack. Without it, a config
# naming the provider refuses to start.
aws-kms = ["dep:aws-config", "dep:aws-sdk-kms", "dep:aws-smithy-http-client"]
# Auto-unseal with Google Cloud KMS (`[seal] provider = "gcpkms"`): Google's
# credential chain and an HTTP client for KMS's REST API. Without it, a
# config naming the provider refuses to start.
gcp-kms = ["dep:google-cloud-auth", "dep:reqwest", "dep:bytes"]

[dependencies]
clap.workspace = true
aws-config = { workspace = true, optional = true }
aws-sdk-kms = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
google-cloud-auth = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
ed25519-dalek.workspace = true
ferritor-core.workspace = true
ferritor-datastore.workspace = true
ferritor-keystore.workspace = true
ferritor-metrics.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
config.workspace = true
dotenvy.workspace = true
getrandom.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tower.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tonic-types.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
# `verify`: CRL signatures, checked when loaded.
x509-parser = { workspace = true, features = ["verify"] }
zeroize.workspace = true
# The issuing CA (identity): its key and certificate, and the certificates
# it signs; x509-parser to take a CSR's public key.
rcgen = { workspace = true, features = ["x509-parser"] }
ring.workspace = true
# Fetching a token issuer's keys (a JWKS over https).
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
webpki-roots.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
proptest.workspace = true
# A fake collector receiving OTLP in the metrics test.
opentelemetry-proto.workspace = true
toml.workspace = true
ferritor-testkit.workspace = true

[lints]
workspace = true

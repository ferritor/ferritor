[package]
name = "ferritor-winsec"
version.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true

# Windows security calls for the agent (and any other ferritor binary on
# Windows): access lists on files and directories, the agent's own process
# locked against other processes. The one crate allowed `unsafe`: Win32's
# security API has no safe wrapper worth depending on. Empty on every other
# platform.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

# The workspace's lints, but `unsafe_code` denied rather than forbidden, so
# the one module that needs it can say so (`#![expect(unsafe_code)]`), and
# every unsafe block must say why it's sound.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
allow_attributes = "deny"
undocumented_unsafe_blocks = "deny"

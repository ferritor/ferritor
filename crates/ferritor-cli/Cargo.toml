[package]
name = "ferritor-cli"
version.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true

[lib]
name = "ferritor_cli"
path = "src/lib.rs"

# The operator/client CLI.
[[bin]]
name = "ferritor"
path = "src/main.rs"
# Its docs would be `main` alone (the library has the rest), and would land
# in target/doc/ferritor/, the root `ferritor` package's place: cargo warns
# of the collision (rust-lang/cargo#6313).
doc = false

[dependencies]
ferritor-client.workspace = true
ferritor-core.workspace = true
anyhow.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting"] }
tokio.workspace = true
toml.workspace = true
tonic.workspace = true
zeroize.workspace = true

# Windows: `login --key-out`'s owner-only access list (the workspace's one
# crate allowed `unsafe`; the CLI has none of its own).
[target.'cfg(windows)'.dependencies]
ferritor-winsec.workspace = true

# The server crates are for the end-to-end tests only (a server in process).
# Never make them normal dependencies: the CLI talks to the server over gRPC
# only.
[dev-dependencies]
tokio-stream.workspace = true
ferritor-datastore.workspace = true
ferritor-keystore.workspace = true
ferritor-server.workspace = true
ferritor-testkit.workspace = true

[lints]
workspace = true

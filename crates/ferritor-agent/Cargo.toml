[package]
name = "ferritor-agent"
version.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true

# Keeps an application's secrets current as files: `ferritor-agent` next to
# an application (`docs/src/content/docs/guides/agent.md`), `ferritor-csi-provider` once per
# Kubernetes node for every pod on it (`docs/src/content/docs/guides/csi.md`).
[dependencies]
ferritor-client.workspace = true
ferritor-core.workspace = true
clap.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

# Unix: modes and groups, the tmpfs check, signals, the undumpable flag.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# Windows: access lists and the process's own (ferritor-winsec), the
# service control manager.
[target.'cfg(windows)'.dependencies]
ferritor-winsec.workspace = true
windows-service.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true

[dev-dependencies]
ferritor-testkit.workspace = true

# The server crates are for the end-to-end tests only (a server in process,
# which is Unix-only: those tests run on Linux, the files' tests everywhere).
# Never make them normal dependencies: the agent talks to the server over
# gRPC only.
# The files' tests read the access lists back.
[target.'cfg(windows)'.dev-dependencies]
ferritor-winsec.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# The CSI tests call the provider over its Unix socket, as the driver does.
hyper-util.workspace = true
tower.workspace = true
ferritor-datastore.workspace = true
ferritor-keystore.workspace = true
ferritor-server.workspace = true

[lints]
workspace = true

# Releases with release-plz (release-plz.toml;
# docs/src/content/docs/contributing/development.md, "Releases"), as the
# ferritor-release GitHub App (the tag ruleset lets only it tag; a pull
# request it opens runs its checks).
#
# `release-pr` opens or updates the release pull request (the next version,
# the changelogs) only when started by hand (Actions, Release-plz, Run
# workflow, on main): run at every push it rebuilt the pull request, and
# ran its checks, after every change.
#
# `release` runs by itself once CI has passed on a push to main, on that
# commit: if it's the merge of a release pull request (release_always =
# false), it tags it and creates the GitHub release, so nothing is tagged
# that CI didn't pass. A release then publishes the container images to
# ghcr.io and signs them with cosign, keyless (`images`, `image-tags`), and
# its binaries: Linux's from the images' build, the CLI's for macOS and
# Windows (`cli-archives`), checksummed and signed (`release-assets`). Nothing goes to crates.io. Pinned like
# ci.yml: actions by commit, the tag in a comment, release-plz and Rust by
# version.
name: Release-plz

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  # release-plz runs cargo; nothing here needs a database.
  SQLX_OFFLINE: "true"

jobs:
  # Tags and releases what a merged release pull request versioned, once CI
  # passed on it: only a push's run (not the daily schedule's), only a
  # success. As the ferritor-release App, like release-pr: the tag ruleset
  # restricts creating release tags to it (GITHUB_TOKEN can't bypass a
  # ruleset). Its token is minted here, from the `release-plz`
  # environment's key, which only main may use (this job runs on the
  # default branch: workflow_run).
  release:
    name: release
    if: >-
      github.repository_owner == 'ferritor'
      && github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-plz
    # GITHUB_TOKEN writes nothing here: the App's token tags and releases.
    permissions:
      contents: read
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    outputs:
      # The product's version (the server's), if this run released it.
      version: ${{ steps.released.outputs.version }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write # push the tags, create the release
          permission-pull-requests: read # find the release pull request and its commits
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI passed, not whatever main is now: release-plz
          # releases the checked-out commit if it's a release merge.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # the whole history: tags and the commits since them
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
      - id: release-plz
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
          version: "0.4.2"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - id: released
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          version=$(jq -r '.[]? | select(.package_name == "ferritor-server") | .version' <<<"${RELEASES:-[]}")
          echo "version=$version" >>"$GITHUB_OUTPUT"

  # Opens or updates the release pull request, started by hand, on main
  # only. As the ferritor-release GitHub App: a pull request opened with
  # GITHUB_TOKEN starts no workflow, so CI and Docs wouldn't run on it. The
  # App's token is minted here for this job only (an hour at most, this
  # repository, contents and pull requests), from its private key in the
  # `release-plz` environment, which only main may use.
  release-pr:
    name: release pull request
    if: >-
      github.repository_owner == 'ferritor'
      && github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-plz
    # GITHUB_TOKEN writes nothing here: the App's token pushes the branch
    # and opens the pull request.
    permissions:
      contents: read
    # One at a time, and never cut short: a cancelled run can leave the
    # branch and the pull request half updated.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Started while a release is still on its way (a release pull request
      # just merged, CI not yet through, so `release` hasn't tagged it), it
      # would offer that version again in a second pull request. Refused:
      # wait for the release, then run it again.
      - name: No release on its way
        run: |
          subject=$(git log -1 --format=%s)
          case "$subject" in
            "Merge pull request #"*" from ferritor/release-plz-"*|"chore: release v"*)
              if ! git tag --points-at HEAD | grep -q '^v'; then
                echo "::error::main's newest commit merges a release pull request that isn't released yet (no v* tag): wait for CI and the release, then run this again"
                exit 1
              fi
              ;;
          esac
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
      - id: release-plz
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
          version: "0.4.2"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      # release-plz bumps the versions in Cargo.lock, not in fuzz/Cargo.lock:
      # the fuzz crate is a workspace of its own, whose lockfile records the
      # ferritor crates' versions too, and CI builds it --locked. So the
      # release pull request carries that update as well, committed through
      # the API (a commit GitHub signs, as the App). release-plz rebuilds the
      # branch each time this job runs; this adds it back each time.
      - name: fuzz/Cargo.lock for the release's versions
        if: steps.release-plz.outputs.pr != '' && steps.release-plz.outputs.pr != '{}'
        env:
          PR: ${{ steps.release-plz.outputs.pr }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch=$(jq -er .head_branch <<<"$PR")
          git fetch --quiet origin "$branch"
          git checkout --quiet --detach FETCH_HEAD
          cp Cargo.lock fuzz/Cargo.lock
          cargo fetch --quiet --manifest-path fuzz/Cargo.toml
          if git diff --quiet -- fuzz/Cargo.lock; then
            echo "fuzz/Cargo.lock already has the release's versions"
            exit 0
          fi
          git diff --stat -- fuzz/Cargo.lock
          # The request in a file: the file, base64, is longer than one
          # command-line argument may be (128 KiB).
          base64 -w0 fuzz/Cargo.lock >"$RUNNER_TEMP/content"
          jq -n \
            --arg message "chore: fuzz/Cargo.lock for the release's versions" \
            --arg branch "$branch" \
            --arg sha "$(git rev-parse FETCH_HEAD:fuzz/Cargo.lock)" \
            --rawfile content "$RUNNER_TEMP/content" \
            '{message: $message, branch: $branch, sha: $sha, content: $content}' \
            >"$RUNNER_TEMP/request.json"
          gh api --method PUT "repos/$GH_REPO/contents/fuzz/Cargo.lock" \
            --input "$RUNNER_TEMP/request.json" --jq '.commit.html_url'

  # The container images of a release: the Dockerfile's four targets, built
  # on a runner of each architecture (natively: Rust under emulation takes
  # hours), from the commit just released, each image pushed by digest.
  # `image-tags` then gives each image its version and `latest` over both.
  # The same build's binaries become the release's archive for the
  # architecture, which `release-assets` checksums, signs and attaches.
  images:
    name: images (${{ matrix.arch }})
    needs: release
    if: needs.release.outputs.version != ''
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Log in to ghcr.io
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io --username "$ACTOR" --password-stdin <<<"$TOKEN"
      - name: Build and push by digest
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.release.outputs.version }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # A builder that can push by digest (the default one can't).
          docker buildx create --use --driver docker-container >/dev/null
          mkdir -p "$RUNNER_TEMP/digests"
          for target in server csi-provider agent cli; do
            image="$REGISTRY/ferritor-$target"
            docker buildx build --target "$target" --platform "linux/$ARCH" \
              --label "org.opencontainers.image.source=$SOURCE" \
              --label "org.opencontainers.image.version=$VERSION" \
              --label "org.opencontainers.image.revision=$REVISION" \
              --label "org.opencontainers.image.title=ferritor-$target" \
              --label "org.opencontainers.image.licenses=MIT OR Apache-2.0" \
              --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "$RUNNER_TEMP/$target.json" .
            jq -er '."containerimage.digest"' "$RUNNER_TEMP/$target.json" >"$RUNNER_TEMP/digests/$target"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1
      - name: The binaries, as the release's archive
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          case "$ARCH" in
            amd64) triple=x86_64-unknown-linux-musl ;;
            arm64) triple=aarch64-unknown-linux-musl ;;
          esac
          name="ferritor-$VERSION-$triple"
          # The images' build stage, cached by the builder above: seconds.
          docker buildx build --target binaries --platform "linux/$ARCH" \
            --output "type=local,dest=$RUNNER_TEMP/$name" .
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt "$RUNNER_TEMP/$name/"
          # The export makes the directory private; unpacked, it's anyone's.
          chmod 0755 "$RUNNER_TEMP/$name"
          mkdir -p "$RUNNER_TEMP/assets"
          # Reproducible: entries sorted, the commit's time, no owner names,
          # no timestamp in the gzip header.
          tar -C "$RUNNER_TEMP" --sort=name --mtime="@$(git log -1 --format=%ct)" \
            --owner=0 --group=0 --numeric-owner -cf - "$name" \
            | gzip -n -9 >"$RUNNER_TEMP/assets/$name.tar.gz"
          tar -tzvf "$RUNNER_TEMP/assets/$name.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-${{ matrix.arch }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          retention-days: 1

  # The CLI for macOS (Apple silicon and Intel) and Windows (x86_64), and
  # the agent for Windows, cross-built on Linux with cargo-zigbuild (Zig as the C compiler and linker,
  # without Apple's or Microsoft's SDKs; the macOS binaries ad-hoc signed by
  # Zig's linker, which Apple silicon requires), as CI's `cli-cross` builds
  # them. One archive per platform, the CLI alone: the Linux archives
  # (`images`) carry it with the other binaries.
  cli-archives:
    name: CLI archives (macOS, Windows), the Windows agent
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ZIG_VERSION: "0.17.1"
      ZIG_SHA256: 3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
      CARGO_ZIGBUILD_VERSION: "0.24.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Install protoc and zip
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler zip
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, x86_64-pc-windows-gnu
      - name: Install Zig and cargo-zigbuild
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xJf "$RUNNER_TEMP/zig.tar.xz"
          echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION" >>"$GITHUB_PATH"
          cargo install cargo-zigbuild --locked --version "$CARGO_ZIGBUILD_VERSION"
      - name: Build, and archive each platform's
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          mtime=$(git log -1 --format=%ct)
          for triple in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-gnu; do
            cargo zigbuild --release --locked -p ferritor-cli --target "$triple"
            name="ferritor-cli-$VERSION-$triple"
            mkdir "$RUNNER_TEMP/$name"
            case "$triple" in
              *-windows-*) cp "target/$triple/release/ferritor.exe" "$RUNNER_TEMP/$name/" ;;
              *) cp "target/$triple/release/ferritor" "$RUNNER_TEMP/$name/" ;;
            esac
            cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt "$RUNNER_TEMP/$name/"
            chmod 0755 "$RUNNER_TEMP/$name"
            # Reproducible, as the Linux archives: entries sorted, the
            # commit's time, no owner names. Windows gets a zip (Explorer
            # opens it), macOS a tar.gz.
            case "$triple" in
              *-windows-*)
                find "$RUNNER_TEMP/$name" -exec touch -h -d "@$mtime" {} +
                (cd "$RUNNER_TEMP" && find "$name" | LC_ALL=C sort | TZ=UTC zip -X -q -9 -@ "$RUNNER_TEMP/assets/$name.zip")
                unzip -l "$RUNNER_TEMP/assets/$name.zip"
                ;;
              *)
                tar -C "$RUNNER_TEMP" --sort=name --mtime="@$mtime" \
                  --owner=0 --group=0 --numeric-owner -cf - "$name" \
                  | gzip -n -9 >"$RUNNER_TEMP/assets/$name.tar.gz"
                tar -tzvf "$RUNNER_TEMP/assets/$name.tar.gz"
                ;;
            esac
          done
          # The agent for Windows: its own zip, packed the same way (the
          # Linux archives carry the Linux agent).
          triple=x86_64-pc-windows-gnu
          cargo zigbuild --release --locked -p ferritor-agent --bin ferritor-agent --target "$triple"
          name="ferritor-agent-$VERSION-$triple"
          mkdir "$RUNNER_TEMP/$name"
          cp "target/$triple/release/ferritor-agent.exe" LICENSE-MIT LICENSE-APACHE \
            THIRD-PARTY-LICENSES.txt "$RUNNER_TEMP/$name/"
          chmod 0755 "$RUNNER_TEMP/$name"
          find "$RUNNER_TEMP/$name" -exec touch -h -d "@$mtime" {} +
          (cd "$RUNNER_TEMP" && find "$name" | LC_ALL=C sort | TZ=UTC zip -X -q -9 -@ "$RUNNER_TEMP/assets/$name.zip")
          unzip -l "$RUNNER_TEMP/assets/$name.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-cli
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          retention-days: 1

  image-tags:
    name: image tags
    needs: [release, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write # tag and sign on ghcr.io
      id-token: write # cosign's keyless signing: this workflow's identity
    steps:
      # Checks the cosign it installs: its own bootstrap version by checksum,
      # the one asked for by that one's signature.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
      - name: Log in to ghcr.io
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io --username "$ACTOR" --password-stdin <<<"$TOKEN"
      - name: Tag and sign each image, both architectures under one name
        env:
          VERSION: ${{ needs.release.outputs.version }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/digests"
          mkdir -p "$RUNNER_TEMP/signed"
          for target in server csi-provider agent cli; do
            image="$REGISTRY/ferritor-$target"
            # The annotations are what ghcr.io shows, and how it links the
            # package to this repository.
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=$SOURCE" \
              --annotation "index:org.opencontainers.image.version=$VERSION" \
              --annotation "index:org.opencontainers.image.revision=$REVISION" \
              --annotation "index:org.opencontainers.image.title=ferritor-$target" \
              --annotation "index:org.opencontainers.image.licenses=MIT OR Apache-2.0" \
              --tag "$image:$VERSION" --tag "$image:latest" \
              "$image@$(cat digests-amd64/$target)" "$image@$(cat digests-arm64/$target)"
            # Signed by digest, never by tag (a tag can move), keyless: the
            # certificate names this workflow on main, which is what
            # `cosign verify` checks. --recursive signs each architecture's
            # image too, for whoever pulls one by its own digest.
            digest=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' | jq -er .digest)
            cosign sign --yes --recursive "$image@$digest"
            echo "$image:$VERSION $digest signed"
            echo "$target $digest" >>"$RUNNER_TEMP/signed/images"
          done
      # For the release notes (release-assets).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-signed
          path: ${{ runner.temp }}/signed
          if-no-files-found: error
          retention-days: 1

  # Completes the release and publishes it: release-plz created it as a
  # draft, because a published release is immutable here (no asset can be
  # added after). The archives' checksums, each file signed with cosign
  # (keyless, the same identity as the images), the images' digests and
  # how to verify in the notes, then published. Until this succeeds the
  # release stays a draft, and re-running this job completes it.
  release-assets:
    name: release assets, publish
    needs: [release, images, image-tags, cli-archives]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # upload to the draft release, and publish it
      id-token: write # cosign's keyless signing: this workflow's identity
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assets-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images-signed
          path: ${{ runner.temp }}/signed
      - name: Checksums, and each file signed
        working-directory: ${{ runner.temp }}/assets
        run: |
          sha256sum -- *.tar.gz *.zip >SHA256SUMS
          cat SHA256SUMS
          for f in *.tar.gz *.zip SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null
          done
          ls -l
      - name: The images and how to verify in the notes, the assets attached, published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release-plz.yml@refs/heads/main
        run: |
          tag="v$VERSION"
          notes="$RUNNER_TEMP/notes.md"
          gh release view "$tag" --json body --jq .body >"$notes"
          {
            echo
            echo "### Container images"
            echo
            echo "For amd64 and arm64, signed with cosign by this release's workflow:"
            echo
            while read -r target digest; do
              echo "- \`$REGISTRY/ferritor-$target:$VERSION\` (\`$digest\`)"
            done <"$RUNNER_TEMP/signed/images"
            echo
            echo "### Verifying"
            echo
            echo "An image (deploy it by the digest that verified):"
            echo
            echo '```sh'
            echo "cosign verify $REGISTRY/ferritor-server:$VERSION \\"
            echo "  --certificate-identity $IDENTITY \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "An archive (the static binaries, for x86_64 or aarch64 Linux):"
            echo
            echo '```sh'
            echo "f=ferritor-$VERSION-x86_64-unknown-linux-musl.tar.gz"
            echo "cosign verify-blob \"\$f\" --bundle \"\$f.sigstore.json\" \\"
            echo "  --certificate-identity $IDENTITY \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
            echo
            echo "The CLI alone, for macOS and Windows, verifies the same way:"
            echo
            echo "- \`ferritor-cli-$VERSION-aarch64-apple-darwin.tar.gz\` (Apple silicon)"
            echo "- \`ferritor-cli-$VERSION-x86_64-apple-darwin.tar.gz\` (Intel Macs)"
            echo "- \`ferritor-cli-$VERSION-x86_64-pc-windows-gnu.zip\` (Windows, x86_64)"
            echo
            echo "The agent for Windows (x86_64), \`ferritor-agent-$VERSION-x86_64-pc-windows-gnu.zip\`,"
            echo "too: see https://ferritor.dev/guides/agent/#windows."
            echo
            echo "None is notarized or signed by a publisher: fetched with \`curl\`,"
            echo "they run as they are; downloaded with a browser, macOS needs"
            echo "\`xattr -d com.apple.quarantine ferritor\` and Windows SmartScreen asks first."
            echo "Windows 11's Smart App Control, where it's on, may refuse to run them."
          } >>"$notes"
          gh release edit "$tag" --notes-file "$notes"
          gh release upload "$tag" "$RUNNER_TEMP"/assets/*
          gh release edit "$tag" --draft=false --latest
